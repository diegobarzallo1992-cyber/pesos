<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123B44">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>Control de pesos - Filling Pouch</title>
<style>
  :root{
    --paper:#EFF1EE; --panel:#FFFFFF; --ink:#171B1E; --steel:#5A666F;
    --hair:#D3D8D4; --deep:#123B44; --ok:#1E7F4C; --warn:#B57608; --bad:#B33127;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{overscroll-behavior-y:contain}
  button{touch-action:manipulation}
  button:active{filter:brightness(.92); transform:scale(.98)}
  .wrap{padding-top:calc(20px + env(safe-area-inset-top)); padding-bottom:calc(64px + env(safe-area-inset-bottom)); padding-left:max(16px,env(safe-area-inset-left)); padding-right:max(16px,env(safe-area-inset-right))}
  @media (max-width:639px){
    nav{position:sticky; top:0; z-index:50; background:var(--paper)}
    nav button{flex:1; padding:14px 8px}
    .seg button{min-height:48px}
    .x{min-width:44px; min-height:44px; font-size:1.4rem}
    input,select{font-size:16px; min-height:48px}
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
    font-size:16px; -webkit-text-size-adjust:100%;
  }
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:1100px; margin:0 auto; padding:20px 16px 64px}
  h1{font-size:1.7rem; margin:0; line-height:1.15}
  h2{font-size:1rem; margin:0}
  header .sub{color:var(--steel); font-size:.9rem}
  .head-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 16px; margin-bottom:16px}
  .titulo{display:flex; align-items:center; gap:14px}
  .logo{height:52px; width:auto; flex:none}
  @media print{ .logo{height:44px} }
  nav{display:flex; border-bottom:1px solid var(--hair); margin-bottom:24px}
  nav button{
    background:none; border:none; border-bottom:2px solid transparent;
    padding:9px 16px; font:600 .9rem inherit; color:var(--steel); cursor:pointer; margin-bottom:-1px;
  }
  nav button[aria-selected="true"]{color:var(--deep); border-bottom-color:var(--deep)}
  .panel{background:var(--panel); border:1px solid var(--hair); padding:18px}
  label.campo{display:block}
  .et{display:block; margin-bottom:4px; font-size:.85rem; font-weight:600; color:var(--steel)}
  input,select{
    width:100%; border:1px solid var(--hair); background:#fff; padding:9px 10px;
    font:400 .95rem inherit; color:var(--ink); border-radius:0;
  }
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--deep); outline-offset:1px}
  input.n{font-size:1.35rem; font-weight:700; text-align:center; padding:7px; font-variant-numeric:tabular-nums}
  .grid2{display:grid; gap:16px; grid-template-columns:1fr}
  .grid3{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  .grid4{display:grid; gap:12px; grid-template-columns:repeat(2,1fr)}
  @media (min-width:640px){ .grid4{grid-template-columns:repeat(4,1fr)} }
  .badge-hora{color:var(--steel); font-variant-numeric:tabular-nums; white-space:nowrap}
  .modal-fondo{
    position:fixed; inset:0; background:rgba(12,16,18,.55);
    display:flex; align-items:center; justify-content:center; padding:16px; z-index:80;
  }
  .modal-caja{
    background:var(--panel); border:1px solid var(--hair); width:100%; max-width:640px;
    max-height:92vh; overflow-y:auto; padding:20px;
  }
  .modal-caja h2{margin:0 0 16px; font-size:1.15rem}
  .modal-acciones{display:flex; justify-content:flex-end; gap:8px; margin-top:20px}
  .btn-editar{padding:5px 10px; font-size:.75rem}
  .seg{display:flex; flex-wrap:wrap; gap:1px; background:var(--hair)}
  .seg button{
    background:#fff; border:none; color:var(--steel); cursor:pointer;
    font:600 .95rem inherit; padding:10px 20px; min-width:52px;
  }
  .seg.compacto button{padding:9px 12px; font-size:.9rem; min-width:44px}
  .seg button[aria-pressed="true"]{background:var(--deep); color:#fff}
  .principal{
    width:100%; margin-top:20px; padding:14px; border:none; cursor:pointer;
    background:var(--deep); color:#fff; font:600 1rem inherit;
  }
  .principal:hover{opacity:.9}
  .sec{border:1px solid var(--hair); background:#fff; color:var(--steel); font:600 .875rem inherit; padding:9px 16px; cursor:pointer}
  .sec.oscuro{background:var(--deep); color:#fff; border-color:var(--deep)}
  .sec:disabled{opacity:.4; cursor:default}
  .lectura .cifra{font-size:3.4rem; font-weight:700; line-height:1; margin:4px 0 0; font-variant-numeric:tabular-nums}
  .barra{height:8px; background:#E4E7E4; margin-top:12px}
  .barra > div{height:8px; transition:width .15s}
  .lista{list-style:none; margin:0; padding:0; display:grid; gap:1px}
  .lista li{display:flex; align-items:center; gap:12px; background:var(--panel); border-left:4px solid; padding:8px 12px; font-size:.9rem}
  .lista .pc{width:58px; font-weight:700; font-variant-numeric:tabular-nums}
  .lista .tx{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .x{background:none; border:none; color:var(--steel); font-size:1.1rem; line-height:1; cursor:pointer; padding:0 4px}
  .vacio{border:1px dashed var(--hair); color:var(--steel); text-align:center; padding:48px 16px; margin:0}
  .kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--hair)}
  .kpi{background:var(--panel); padding:16px}
  .kpi .t{font-size:.85rem; font-weight:600; color:var(--steel); margin:0}
  .kpi .v{font-size:1.9rem; font-weight:700; line-height:1; margin:4px 0 0; font-variant-numeric:tabular-nums}
  .kpi .n{font-size:.75rem; color:var(--steel); margin:4px 0 0}
  .tarjeta{background:var(--panel); border:1px solid var(--hair); padding:16px; margin-top:24px}
  .tarjeta .cab{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:14px}
  .tarjeta .cab span{font-size:.75rem; color:var(--steel)}
  .rank{display:grid; gap:8px}
  .fila{display:grid; grid-template-columns:130px 1fr 56px; align-items:center; gap:10px; font-size:.85rem}
  .fila .pista{background:#EDEFEC; height:18px; position:relative}
  .fila .pista > i{display:block; height:18px}
  .fila .pista > u{position:absolute; top:-2px; bottom:-2px; width:0; border-left:1px dashed var(--bad)}
  .fila .val{text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
  .fila .nom{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .filtros{display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px; margin-bottom:20px}
  .filtros label{display:block}
  .filtros .et{font-size:.75rem}
  .filtros select,.filtros input{width:auto; padding:6px 8px; font-size:.875rem}
  .enlace{background:none; border:none; color:var(--deep); font:600 .875rem inherit; text-decoration:underline; cursor:pointer; padding-bottom:8px}
  .tabla-caja{overflow-x:auto; border:1px solid var(--hair); background:var(--panel)}
  table{width:100%; border-collapse:collapse; font-size:.85rem; font-variant-numeric:tabular-nums}
  th{background:var(--deep); color:#fff; font-weight:600; text-align:left; padding:9px 12px; white-space:nowrap}
  td{padding:8px 12px}
  tbody tr:nth-child(even){background:#F7F8F7}
  .der{text-align:right}
  .barras-aviso{border-left:4px solid var(--warn); background:#FDF6E6; padding:10px 12px; font-size:.875rem; margin-bottom:16px}
  .acciones{display:flex; flex-wrap:wrap; gap:8px}
  @media (min-width:640px){ .grid2{grid-template-columns:1fr 1fr} }
  @media (min-width:1024px){
    .registro{display:grid; grid-template-columns:1fr 320px; gap:24px; align-items:start}
    .kpis{grid-template-columns:repeat(4,1fr)}
    .dos{display:grid; grid-template-columns:1fr 1fr; gap:24px}
    .dos .tarjeta{margin-top:24px}
  }
  @media print{
    nav,.principal,.x,.acciones,.filtros{display:none}
    body{background:#fff}
    .tabla-caja{border:none}
  }
</style>
</head>

<script>
"use strict";

/* ---------------- configuracion del area ---------------- */
var LINEAS = ["A","B","C","D","E"];
var TURNOS = ["Primero","Segundo"];
var SUPERVISORES = ["Xavier Barzallo","Sheyla Martillo"];
var BALANZAS_POR_LINEA = { A:12, B:12, C:10, D:6, E:10 };
var SEMI_ESTACIONES = 14;
var KEY = "pesos-filling-pouch-v2";
var CLAVE_ADMIN = "Xbarzallo2026";

function pedirClave(mensaje){
  var ingresada = window.prompt(mensaje + "\n\nIngresa la clave de autorizacion para continuar:");
  if (ingresada === null) return false;
  if (ingresada !== CLAVE_ADMIN){
    alert("Clave incorrecta. La accion fue cancelada.");
    return false;
  }
  return true;
}

function tieneSemi(l){ return l === "E"; }
function balanzasDe(linea, tipo){
  var n = (tieneSemi(linea) && tipo === "Semiautomatica")
    ? SEMI_ESTACIONES : (BALANZAS_POR_LINEA[linea] || 0);
  var a = [];
  for (var i = 1; i <= n; i++) a.push(String(i));
  return a;
}
function estacion(r){
  return r.tipo === "Semiautomatica" ? r.linea + " semi " + r.balanza : r.linea + "-" + r.balanza;
}
function hoyLocal(){
  var d = new Date(), p = function(x){ return String(x).padStart(2,"0"); };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function fmtFecha(iso){ var p = (iso||"").split("-"); return p.length===3 ? p[2]+"/"+p[1] : ""; }
function fmtHora(valor){
  if (!valor) return "";
  if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(valor)) return valor;
  var d = new Date(valor);
  if (isNaN(d.getTime())) return "";
  var p = function(x){ return String(x).padStart(2,"0"); };
  return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
function pctDe(f,t){ return (!t || t<=0) ? null : (f/t)*100; }
function estado(pct, umbral){
  if (pct === null || pct === undefined) return { color:"var(--steel)", texto:"Sin datos" };
  if (pct > umbral) return { color:"var(--bad)", texto:"Fuera de control" };
  if (pct > umbral*0.6) return { color:"var(--warn)", texto:"Cerca del limite" };
  return { color:"var(--ok)", texto:"En control" };
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function uid(){ return Date.now() + "-" + Math.random().toString(36).slice(2,7); }

  filtros: { linea:"Todas", turno:"Todos", desde:"", hasta:"" }
};

/* ---------------- almacenamiento ---------------- */
var modo = "memoria";

async function cargar(){
  if (window.storage){
    modo = "app";
    try {
      var r = await window.storage.get(KEY, false);
      if (r && r.value) return JSON.parse(r.value);
    } catch(e){}
    return null;
  }
  try {
    localStorage.setItem("__prueba__","1");
    localStorage.removeItem("__prueba__");
    modo = "local";
    var t = localStorage.getItem(KEY);
    return t ? JSON.parse(t) : null;
  } catch(e){ modo = "memoria"; return null; }
}

async function guardarDatos(){
  var carga = JSON.stringify({ registros: S.registros, umbral: S.umbral });
  if (modo === "app"){
    try { await window.storage.set(KEY, carga, false); } catch(e){ modo = "memoria"; mostrarAviso(); }
    return;
  }
  if (modo === "local"){
    try { localStorage.setItem(KEY, carga); } catch(e){ modo = "memoria"; mostrarAviso(); }
  }
}

function mostrarAviso(){
  if (modo === "memoria"){
    var el = document.getElementById("avisoAlmacen");
    el.textContent = "Este navegador no esta guardando los datos. Exporta el archivo CSV antes de cerrar la pagina.";
    el.style.display = "block";
  }
}

/* ---------------- navegacion ---------------- */
var TABS = [["registro","Registrar muestra"],["panel","Panel"],["datos","Datos"]];

function pintarNav(){
  document.getElementById("nav").innerHTML = TABS.map(function(t){
    return '<button role="tab" data-v="'+t[0]+'" aria-selected="'+(S.vista===t[0])+'">'+t[1]+'</button>';

  document.querySelectorAll("#nav button").forEach(function(b){
    b.onclick = function(){ S.vista = b.dataset.v; render(); };
  });
}

function render(){
  pintarNav();
  var v = document.getElementById("vista");
  if (S.vista === "registro") vistaRegistro(v);
  else if (S.vista === "panel") vistaPanel(v);
  else vistaDatos(v);
}

        '<p id="estadoTx" style="margin:4px 0 0; font-weight:600; font-size:.9rem; color:var(--steel)">Sin datos</p>'+
        '<div class="barra"><div id="barra" style="width:0"></div></div>'+
        '<p id="notaLectura" style="margin:8px 0 0; font-size:.875rem; color:var(--steel)">0 separadas - limite '+S.umbral+'%</p>'+
      '</div>'+
      '<h2 style="margin:20px 0 8px; font-size:.85rem; color:var(--steel)">Ultimas muestras</h2>'+
      '<div id="recientes"></div>'+
    '</aside>'+
  '</div>';

  pintarSeg("segTurno", TURNOS, f.turno, function(v){ f.turno = v; pintarControles(); });
  pintarSeg("segLinea", LINEAS, f.linea, cambiarLinea);
  pintarControles();
  pintarSupervisor();
  llenarDatalist("lc", "controladora");
  llenarDatalist("lp", "pesador");
  pintarRecientes();

  ["total","altas","bajas","critico"].forEach(function(id){
    document.getElementById(id).addEventListener("input", actualizarLectura);
  });
  document.getElementById("fecha").addEventListener("change", function(e){ f.fecha = e.target.value; });
  document.getElementById("btnGuardar").onclick = guardarMuestra;
  actualizarLectura();
}

function pintarSeg(id, opciones, valor, alTocar){
  var c = document.getElementById(id);
  if (!c) return;
  c.innerHTML = opciones.map(function(o){
    return '<button type="button" aria-pressed="'+(o===valor)+'" data-o="'+esc(o)+'">'+esc(o)+'</button>';
  }).join("");
  c.querySelectorAll("button").forEach(function(b){
    b.onclick = function(){ alTocar(b.dataset.o); };
  });
}

function cambiarLinea(v){
  var f = S.form;
  f.linea = v;
  if (!tieneSemi(v)) f.tipo = "Manual";
  var d = balanzasDe(f.linea, f.tipo);
  if (d.indexOf(f.balanza) === -1) f.balanza = d[0] || "";
  pintarSeg("segLinea", LINEAS, f.linea, cambiarLinea);
  pintarControles();
}

function pintarControles(){
  var f = S.form;
  pintarSeg("segTurno", TURNOS, f.turno, function(v){ f.turno = v; pintarControles(); });
  var bloque = document.getElementById("bloqueTipo");
  if (tieneSemi(f.linea)){
    bloque.style.display = "";
    pintarSeg("segTipo", ["Manual","Semiautomatica"], f.tipo, function(v){
      f.tipo = v;
      var d = balanzasDe(f.linea, v);
      if (d.indexOf(f.balanza) === -1) f.balanza = d[0] || "";
      pintarControles();
    });
  } else {
    bloque.style.display = "none";
  }
  document.getElementById("etBalanza").textContent =
    (f.tipo === "Semiautomatica") ? "Estacion semiautomatica" : "Balanza";
  pintarBalanzas();
}

function pintarSupervisor(){
  pintarSeg("segSupervisor", SUPERVISORES, S.form.supervisor, function(v){
    S.form.supervisor = v;
    pintarSupervisor();
  });
}

function pintarBalanzas(){
  var f = S.form;
  pintarSeg("segBalanza", balanzasDe(f.linea, f.tipo), f.balanza, function(v){
    f.balanza = v;
    pintarBalanzas();
  });
}

function llenarDatalist(id, campo){
  var vistos = {}, salida = [];
  S.registros.forEach(function(r){
    if (r[campo] && !vistos[r[campo]]){ vistos[r[campo]] = 1; salida.push(r[campo]); }
  });
  salida.sort();
  document.getElementById(id).innerHTML =
    salida.map(function(n){ return '<option value="'+esc(n)+'">'; }).join("");
}

function leerNum(id){ var v = parseInt(document.getElementById(id).value, 10); return isNaN(v) ? 0 : v; }

function actualizarLectura(){
  var total = parseInt(document.getElementById("total").value, 10);
  var fuera = leerNum("altas") + leerNum("bajas") + leerNum("critico");
  var pct = pctDe(fuera, total);
  var e = estado(pct, S.umbral);
  document.getElementById("cifra").textContent = (pct === null) ? "-" : pct.toFixed(1) + "%";
  document.getElementById("cifra").style.color = e.color;
  document.getElementById("estadoTx").textContent = e.texto;
  document.getElementById("estadoTx").style.color = e.color;
  var b = document.getElementById("barra");
  b.style.width = (pct === null ? 0 : Math.min(pct,100)) + "%";
  b.style.background = e.color;
  document.getElementById("notaLectura").textContent = fuera + " separadas - limite " + S.umbral + "%";
}

function guardarMuestra(){
  var f = S.form;
  var av = document.getElementById("aviso");
  var supervisor = f.supervisor;
  var controladora = document.getElementById("controladora").value.trim();
  var pesador = document.getElementById("pesador").value.trim();
  var producto = document.getElementById("producto").value.trim();
  var total = parseInt(document.getElementById("total").value, 10);
  var altas = leerNum("altas"), bajas = leerNum("bajas"), critico = leerNum("critico");
  var fuera = altas + bajas + critico;

  if (!supervisor)   return (av.textContent = "Escribe el nombre del supervisor del turno.");
  if (!controladora) return (av.textContent = "Escribe el nombre de la controladora de linea.");
  if (!pesador)      return (av.textContent = "Escribe el nombre del pesador.");
  if (!f.balanza)    return (av.textContent = "Selecciona la balanza o la estacion.");
  if (isNaN(total) || total <= 0) return (av.textContent = "El total de fundas revisadas debe ser mayor que cero.");
  if (fuera > total) return (av.textContent = "Las fundas fuera de peso no pueden superar el total revisado.");
  av.textContent = "";

  S.registros.unshift({
    id: uid(), fecha: f.fecha, horaRegistro: new Date().toISOString(), turno: f.turno, supervisor: supervisor,
    linea: f.linea, tipo: f.tipo, balanza: f.balanza,
    controladora: controladora, pesador: pesador, producto: producto,
    total: total, altas: altas, bajas: bajas, critico: critico, fuera: fuera, pct: pctDe(fuera, total)
  });
  guardarDatos();

  ["total","altas","bajas","critico"].forEach(function(id){ document.getElementById(id).value = ""; });
  actualizarLectura();
  llenarDatalist("lc","controladora");
  llenarDatalist("lp","pesador");
  pintarRecientes();
  document.getElementById("total").focus();
}

function pintarRecientes(){
  var c = document.getElementById("recientes");
  if (!c) return;
  var r8 = S.registros.slice(0,8);
  if (!r8.length){
    c.innerHTML = '<p class="vacio" style="padding:24px 12px; font-size:.875rem">Aun no hay muestras. La primera que guardes aparece aqui.</p>';
    return;
  }
  c.innerHTML = '<ul class="lista">' + r8.map(function(r){
    var e = estado(r.pct, S.umbral);
    return '<li style="border-left-color:'+e.color+'">'+
      '<span class="pc" style="color:'+e.color+'">'+r.pct.toFixed(1)+'%</span>'+
      '<span class="tx">'+esc(r.pesador)+
        '<span style="color:var(--steel)"> - '+esc(estacion(r))+' - '+fmtFecha(r.fecha)+'</span></span>'+
      '<button class="x" data-id="'+r.id+'" aria-label="Eliminar muestra">&times;</button></li>';
  }).join("") + '</ul>';
  c.querySelectorAll(".x").forEach(function(b){
    b.onclick = function(){ borrar(b.dataset.id); pintarRecientes(); };
  });
}

function borrar(id){
  S.registros = S.registros.filter(function(r){ return r.id !== id; });
  guardarDatos();
}

/* ---------------- vista: panel ---------------- */
function filtrados(){
  var f = S.filtros;
  return S.registros.filter(function(r){
    return (f.linea === "Todas" || r.linea === f.linea)
      && (f.turno === "Todos" || r.turno === f.turno)
      && (!f.desde || r.fecha >= f.desde)
      && (!f.hasta || r.fecha <= f.hasta);
  });
}

function agrupar(datos, clave){
  var m = {};
  datos.forEach(function(r){
    var n = (typeof clave === "function") ? clave(r) : r[clave];
    if (!n) return;
    if (!m[n]) m[n] = { total:0, fuera:0, n:0 };
    m[n].total += r.total; m[n].fuera += r.fuera; m[n].n += 1;
  });
  return Object.keys(m).map(function(n){
    return { nombre:n, pct:+pctDe(m[n].fuera, m[n].total).toFixed(2), n:m[n].n };
  });
}

function ranking(datos, tope){
  if (!datos.length) return '<p style="text-align:center; color:var(--steel); font-size:.875rem; padding:32px 0; margin:0">No hay muestras con estos filtros.</p>';
  var max = Math.max(S.umbral, Math.max.apply(null, datos.map(function(d){ return d.pct; }))) * 1.08;
  return '<div class="rank">' + datos.slice(0, tope || 10).map(function(d){
    var e = estado(d.pct, S.umbral);
    return '<div class="fila" title="'+esc(d.nombre)+' - '+d.n+' muestras">'+
      '<span class="nom">'+esc(d.nombre)+'</span>'+
      '<span class="pista"><i style="width:'+(d.pct/max*100).toFixed(1)+'%; background:'+e.color+'"></i>'+
      '<u style="left:'+(S.umbral/max*100).toFixed(1)+'%"></u></span>'+
      '<span class="val" style="color:'+e.color+'">'+d.pct.toFixed(1)+'%</span></div>';
  }).join("") + '</div>';
}

function grafTendencia(serie){
  if (serie.length < 2)
    return '<p style="text-align:center; color:var(--steel); font-size:.875rem; padding:40px 0; margin:0">Se necesitan al menos dos fechas para dibujar la tendencia.</p>';
  var W = 700, H = 240, L = 44, R = 12, T = 14, B = 30;
  var max = Math.max(S.umbral, Math.max.apply(null, serie.map(function(d){ return d.pct; }))) * 1.15;
  var x = function(i){ return L + (serie.length===1 ? 0 : i*(W-L-R)/(serie.length-1)); };
  var y = function(v){ return T + (H-T-B) * (1 - v/max); };
  var pasos = 4, ejes = "", i;
  for (i = 0; i <= pasos; i++){
    var v = max*i/pasos, yy = y(v);
    ejes += '<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="var(--hair)"/>'+
            '<text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--steel)">'+v.toFixed(0)+'%</text>';
  }
  var salto = Math.ceil(serie.length/10), etiquetas = "";
  serie.forEach(function(d,i){
    if (i % salto === 0)
      etiquetas += '<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--steel)">'+d.fecha+'</text>';
  });
  var linea = serie.map(function(d,i){ return x(i)+","+y(d.pct); }).join(" ");
  var puntos = serie.map(function(d,i){
    return '<circle cx="'+x(i)+'" cy="'+y(d.pct)+'" r="3.5" fill="var(--deep)"><title>'+d.fecha+": "+d.pct.toFixed(1)+'%</title></circle>';
  }).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="240" preserveAspectRatio="none" style="display:block">'+
    ejes +
    '<line x1="'+L+'" y1="'+y(S.umbral)+'" x2="'+(W-R)+'" y2="'+y(S.umbral)+'" stroke="var(--bad)" stroke-dasharray="5 4"/>'+
    '<polyline points="'+linea+'" fill="none" stroke="var(--deep)" stroke-width="2"/>'+ puntos +'</svg>';
}

function fueraDeParametro(datos){
  var m = {};
  datos.forEach(function(r){
    if (!r.pesador) return;
    if (!m[r.pesador])
      m[r.pesador] = { total:0, fuera:0, altas:0, bajas:0, critico:0, n:0, sobre:0, ultima:"", puestos:{} };
    var a = m[r.pesador];
    a.total += r.total; a.fuera += r.fuera; a.altas += r.altas; a.bajas += r.bajas; a.critico += (r.critico||0); a.n += 1;
    if (r.pct > S.umbral) a.sobre += 1;
    if (r.fecha > a.ultima) a.ultima = r.fecha;
    var p = estacion(r);
    a.puestos[p] = (a.puestos[p] || 0) + 1;
  });
  return Object.keys(m).map(function(nombre){
    var a = m[nombre];
    var puesto = Object.keys(a.puestos).sort(function(x,y){ return a.puestos[y] - a.puestos[x]; })[0];
    return {
      nombre: nombre, pct: pctDe(a.fuera, a.total), n: a.n, sobre: a.sobre,
      total: a.total, altas: a.altas, bajas: a.bajas, critico: a.critico, ultima: a.ultima, puesto: puesto
    };
  }).filter(function(p){ return p.pct > S.umbral; })
    .sort(function(a,b){ return b.pct - a.pct; });
}

function tablaFuera(lista){
  if (!lista.length)
    return '<p style="margin:0; padding:24px 0; text-align:center; color:var(--ok); font-weight:600">'+
      'Ninguna pesadora supera el '+S.umbral+'% en el periodo seleccionado.</p>';
  return '<div class="tabla-caja" style="border:none"><table><thead><tr>'+
    '<th>Pesadora</th><th>Balanza</th><th class="der">Revisadas</th>'+
    '<th class="der">Alto</th><th class="der">Bajo</th><th class="der">Critico</th>'+
    '<th class="der">Tomas</th><th class="der">Ultima</th><th class="der">Fuera de peso</th>'+
    '</tr></thead><tbody>'+
    lista.map(function(p){
      return '<tr><td style="font-weight:600">'+esc(p.nombre)+'</td>'+
        '<td style="white-space:nowrap">'+esc(p.puesto)+'</td>'+
        '<td class="der">'+p.total+'</td>'+
        '<td class="der">'+p.altas+'</td>'+
        '<td class="der">'+p.bajas+'</td>'+
        '<td class="der">'+p.critico+'</td>'+
        '<td class="der">'+p.sobre+' de '+p.n+'</td>'+
        '<td class="der">'+fmtFecha(p.ultima)+'</td>'+
        '<td class="der" style="font-weight:700; color:var(--bad)">'+p.pct.toFixed(1)+'%</td></tr>';
    }).join("")+'</tbody></table></div>';
}

function vistaPanel(cont){
  if (!S.registros.length){
    cont.innerHTML = '<p class="vacio">El panel se arma con las muestras que registres. Empieza en Registrar muestra.</p>';
    return;
  }
  var d = filtrados(), f = S.filtros;
  var tot = 0, fue = 0, alt = 0, baj = 0, cri = 0, sobre = 0;
  d.forEach(function(r){
    tot += r.total; fue += r.fuera; alt += r.altas; baj += r.bajas; cri += (r.critico||0);
    if (r.pct > S.umbral) sobre++;
  });
  var pctG = pctDe(fue, tot);
  var pctSobre = d.length ? (sobre/d.length*100) : null;

  var porFecha = {};
  d.forEach(function(r){
    if (!porFecha[r.fecha]) porFecha[r.fecha] = { total:0, fuera:0 };
    porFecha[r.fecha].total += r.total; porFecha[r.fecha].fuera += r.fuera;
  });
  var serie = Object.keys(porFecha).sort().map(function(k){
    return { fecha: fmtFecha(k), pct: pctDe(porFecha[k].fuera, porFecha[k].total) };
  });

  var desc = function(a,b){ return b.pct - a.pct; };
  var porTurno = agrupar(d,"turno").sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
  var porLinea = agrupar(d,"linea").sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
  var porEstacion = agrupar(d, estacion).sort(desc);
  var porPesador = agrupar(d,"pesador").sort(desc);
  var porControladora = agrupar(d,"controladora").sort(desc);
  var porSupervisor = agrupar(d,"supervisor").sort(desc);

  var opc = function(lista, sel){
    return lista.map(function(o){ return '<option'+(o===sel?" selected":"")+'>'+o+'</option>'; }).join("");
  };
  var hayFiltro = (f.linea!=="Todas"||f.turno!=="Todos"||f.desde||f.hasta);

  cont.innerHTML =
  '<div class="filtros">'+
    '<label><span class="et">Linea</span><select id="fLinea">'+opc(["Todas"].concat(LINEAS), f.linea)+'</select></label>'+
    '<label><span class="et">Turno</span><select id="fTurno">'+opc(["Todos"].concat(TURNOS), f.turno)+'</select></label>'+
    '<label><span class="et">Desde</span><input type="date" id="fDesde" value="'+esc(f.desde)+'"></label>'+
    '<label><span class="et">Hasta</span><input type="date" id="fHasta" value="'+esc(f.hasta)+'"></label>'+
    (hayFiltro ? '<button class="enlace" id="fLimpiar">Quitar filtros</button>' : '')+
  '</div>'+
  '<div class="kpis">'+
    kpi("Fuera de peso", pctG===null?"-":pctG.toFixed(1)+"%", "de "+tot.toLocaleString("es-EC")+" fundas revisadas", estado(pctG,S.umbral).color)+
    kpi("Muestras", d.length, "tomas registradas", "")+
    kpi("Sobre el limite", pctSobre===null?"-":pctSobre.toFixed(0)+"%", sobre+" muestras pasan de "+S.umbral+"%", sobre>0?"var(--bad)":"var(--ok)")+
    kpi("Alto / bajo / critico", alt+" / "+baj+" / "+cri,
        (alt+baj+cri===0) ? "sin separaciones"
        : cri>0 && cri>=alt && cri>=baj ? "predominan los pesos criticos"
        : alt>baj ? "predomina el sobrellenado"
        : baj>alt ? "predomina el llenado corto" : "repartido parejo", "")+
  '</div>'+
  tarjeta("Pesadoras fuera del parametro",
    "Superan el "+S.umbral+"% establecido",
    tablaFuera(fueraDeParametro(d)))+
  tarjeta("Tendencia diaria", "Linea de referencia: "+S.umbral+"%", grafTendencia(serie))+
  '<div class="dos">'+
    tarjeta("Por turno","Primero contra Segundo", ranking(porTurno, 2))+
    tarjeta("Por linea","", ranking(porLinea, 5))+
    tarjeta("Por balanza","Las 10 mas altas", ranking(porEstacion))+
    tarjeta("Por pesador","Los 10 mas altos", ranking(porPesador))+
    tarjeta("Por controladora de linea","Las 10 mas altas", ranking(porControladora))+
    tarjeta("Por supervisor del turno","", ranking(porSupervisor, 6))+
  '</div>';

  var recargar = function(){
    f.linea = document.getElementById("fLinea").value;
    f.turno = document.getElementById("fTurno").value;
    f.desde = document.getElementById("fDesde").value;
    f.hasta = document.getElementById("fHasta").value;
    vistaPanel(cont);
  };
  ["fLinea","fTurno","fDesde","fHasta"].forEach(function(id){
    document.getElementById(id).onchange = recargar;
  });
  var lim = document.getElementById("fLimpiar");
  if (lim) lim.onclick = function(){
    S.filtros = { linea:"Todas", turno:"Todos", desde:"", hasta:"" };
    vistaPanel(cont);
  };
}

function kpi(t,v,n,color){
  return '<div class="kpi"><p class="t">'+t+'</p>'+
    '<p class="v"'+(color?' style="color:'+color+'"':'')+'>'+v+'</p><p class="n">'+n+'</p></div>';
}
function tarjeta(titulo, nota, cuerpo){
  return '<section class="tarjeta"><div class="cab"><h2>'+titulo+'</h2>'+
    (nota ? '<span>'+nota+'</span>' : '')+'</div>'+cuerpo+'</section>';
}

      '<input type="file" id="archivoRespaldo" accept=".json,application/json" style="display:none">'+
    '</div>'+
  '</div>'+
  (S.registros.length
    ? '<div class="tabla-caja" style="margin-top:24px"><table><thead><tr>'+
      ["Fecha","Hora","Turno","Supervisor","Linea","Tipo","Balanza","Controladora","Pesador","Producto","Revisadas","Alto","Bajo","Critico","%","Acciones"]
        .map(function(h,i){ return '<th'+(i>=10&&i<=14?' class="der"':'')+'>'+h+'</th>'; }).join("")+
      '</tr></thead><tbody>'+filas+'</tbody></table></div>'
    : '<p class="vacio" style="margin-top:24px">No hay registros guardados todavia.</p>');

  document.getElementById("umbral").onchange = function(e){
    S.umbral = Math.min(100, Math.max(1, parseInt(e.target.value,10) || 1));
    guardarDatos();
    vistaDatos(cont);
  };
  document.getElementById("btnExportar").onclick = exportarCSV;
  document.getElementById("btnImprimir").onclick = function(){ window.print(); };
  document.getElementById("btnImportar").onclick = function(){ document.getElementById("archivo").click(); };
  document.getElementById("archivo").onchange = importarCSV;
  document.getElementById("btnRespaldo").onclick = descargarRespaldo;
  document.getElementById("btnRestaurar").onclick = function(){ document.getElementById("archivoRespaldo").click(); };
  document.getElementById("archivoRespaldo").onchange = restaurarRespaldo;
  document.getElementById("btnReiniciar").onclick = function(){
    if (!pedirClave("Esta accion eliminara TODOS los registros guardados de este dispositivo. No se puede deshacer.")) return;
    if (!confirm("Ultima confirmacion: ¿deseas reiniciar el proceso y borrar todos los registros?")) return;
    S.registros = [];
    guardarDatos();
    vistaDatos(cont);
  };
  var ej = document.getElementById("btnEjemplo");
  if (ej) ej.onclick = function(){
    generarEjemplo();
    S.vista = "panel";
    render();
  };
  cont.querySelectorAll("tbody .x").forEach(function(b){
    b.onclick = function(){ borrar(b.dataset.id); vistaDatos(cont); };
  });
  cont.querySelectorAll("[data-editar]").forEach(function(b){
    b.onclick = function(){ intentarEditar(b.dataset.editar); };
  });
}

/* ---------------- edicion de registros (protegida por clave) ---------------- */
function intentarEditar(id){
  if (!pedirClave("Vas a editar un registro ya guardado.")) return;
  var r = S.registros.find(function(x){ return x.id === id; });
  if (!r) return;
  abrirModalEdicion(r);
}

  var existente = document.getElementById("modalEdicion");
  if (existente) existente.remove();
  var opt = function(lista, sel){

  };
  var html =
  '<div class="modal-fondo" id="modalEdicion">'+
    '<div class="modal-caja">'+
      '<h2>Editar registro</h2>'+
      '<div class="grid2">'+
        '<label class="campo"><span class="et">Fecha</span><input type="date" id="mFecha" value="'+esc(r.fecha)+'"></label>'+
        '<label class="campo"><span class="et">Turno</span><select id="mTurno">'+opt(TURNOS, r.turno)+'</select></label>'+
      '</div>'+
      '<div class="grid2" style="margin-top:12px">'+
        '<label class="campo"><span class="et">Supervisor del turno</span><select id="mSupervisor">'+opt(SUPERVISORES, r.supervisor)+'</select></label>'+
        '<label class="campo"><span class="et">Linea</span><select id="mLinea">'+opt(LINEAS, r.linea)+'</select></label>'+
      '</div>'+
      '<div class="grid2" style="margin-top:12px">'+
        '<label class="campo"><span class="et">Tipo de llenado</span><select id="mTipo">'+opt(["Manual","Semiautomatica"], r.tipo)+'</select></label>'+
        '<label class="campo"><span class="et">Balanza / estacion</span><input id="mBalanza" value="'+esc(r.balanza)+'"></label>'+
      '</div>'+
      '<div class="grid2" style="margin-top:12px">'+
        '<label class="campo"><span class="et">Controladora de linea</span><input id="mControladora" value="'+esc(r.controladora)+'"></label>'+
        '<label class="campo"><span class="et">Pesador</span><input id="mPesador" value="'+esc(r.pesador)+'"></label>'+
      '</div>'+
      '<label class="campo" style="margin-top:12px"><span class="et">Producto</span><input id="mProducto" value="'+esc(r.producto)+'"></label>'+
      '<div class="grid4" style="margin-top:12px">'+
        '<label class="campo"><span class="et">Fundas revisadas</span><input class="n" id="mTotal" type="number" min="0" value="'+r.total+'"></label>'+
        '<label class="campo"><span class="et">Peso alto</span><input class="n" id="mAltas" type="number" min="0" value="'+r.altas+'"></label>'+
        '<label class="campo"><span class="et">Peso bajo</span><input class="n" id="mBajas" type="number" min="0" value="'+r.bajas+'"></label>'+
        '<label class="campo"><span class="et">Peso critico</span><input class="n" id="mCritico" type="number" min="0" value="'+(r.critico||0)+'"></label>'+
      '</div>'+
      '<p id="mAviso" style="margin:12px 0 0; color:var(--bad); font-weight:500; font-size:.9rem"></p>'+
      '<div class="modal-acciones">'+
        '<button class="sec" id="mCancelar">Cancelar</button>'+
        '<button class="sec oscuro" id="mGuardar">Guardar cambios</button>'+
      '</div>'+
    '</div>'+
  '</div>';

  document.getElementById("modalEdicion").addEventListener("click", function(e){
    if (e.target.id === "modalEdicion") cerrarModalEdicion();
  });
  document.getElementById("mGuardar").onclick = function(){ guardarEdicion(r.id); };
}

function cerrarModalEdicion(){
  var m = document.getElementById("modalEdicion");
  if (m) m.remove();
}

function guardarEdicion(id){
  var av = document.getElementById("mAviso");
  var r = S.registros.find(function(x){ return x.id === id; });
  if (!r) return cerrarModalEdicion();

  var total = parseInt(document.getElementById("mTotal").value, 10);
  var altas = parseInt(document.getElementById("mAltas").value, 10) || 0;
  var bajas = parseInt(document.getElementById("mBajas").value, 10) || 0;
  var critico = parseInt(document.getElementById("mCritico").value, 10) || 0;
  var fuera = altas + bajas + critico;
  var controladora = document.getElementById("mControladora").value.trim();
  var pesador = document.getElementById("mPesador").value.trim();
  var balanza = document.getElementById("mBalanza").value.trim();

  if (!controladora) return (av.textContent = "Escribe el nombre de la controladora de linea.");
  if (!pesador)      return (av.textContent = "Escribe el nombre del pesador.");
  if (!balanza)      return (av.textContent = "Escribe la balanza o estacion.");
  if (isNaN(total) || total <= 0) return (av.textContent = "El total de fundas revisadas debe ser mayor que cero.");
  if (fuera > total) return (av.textContent = "Las fundas fuera de peso no pueden superar el total revisado.");
  av.textContent = "";

  r.fecha = document.getElementById("mFecha").value || r.fecha;
  r.turno = document.getElementById("mTurno").value;
  r.supervisor = document.getElementById("mSupervisor").value;
  r.linea = document.getElementById("mLinea").value;
  r.tipo = document.getElementById("mTipo").value;
  r.balanza = balanza;
  r.controladora = controladora;
  r.pesador = pesador;
  r.producto = document.getElementById("mProducto").value.trim();
  r.total = total; r.altas = altas; r.bajas = bajas; r.critico = critico;
  r.fuera = fuera; r.pct = pctDe(fuera, total);

  guardarDatos();
  cerrarModalEdicion();
  render();
}

/* ---------------- copia de respaldo (para abrir en otro dispositivo) ---------------- */
function descargarRespaldo(){
  var payload = JSON.stringify({
    tipo: "respaldo-control-pesos", version: 1, generado: new Date().toISOString(),
    umbral: S.umbral, registros: S.registros
  }, null, 0);
  var url = URL.createObjectURL(new Blob([payload], { type:"application/json;charset=utf-8;" }));
  var a = document.createElement("a");
  a.href = url; a.download = "respaldo-control-pesos-" + hoyLocal() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function restaurarRespaldo(e){
  var archivo = e.target.files[0];
  if (!archivo) return;
  var lector = new FileReader();
  lector.onload = function(ev){
    var datos;
    try { datos = JSON.parse(String(ev.target.result)); }
    catch(err){ alert("El archivo de respaldo no es valido."); e.target.value = ""; return; }
    if (!datos || !Array.isArray(datos.registros)){
      alert("El archivo de respaldo no tiene el formato esperado.");
      e.target.value = ""; return;
    }
    var reemplazar = S.registros.length
      ? confirm("Ya existen "+S.registros.length+" registros en este dispositivo.\n\n"+
        "Aceptar: REEMPLAZAR todo con la copia de respaldo.\n"+
        "Cancelar: combinar y conservar ambos conjuntos de datos.")
      : true;
    if (reemplazar){
      S.registros = datos.registros;
    } else {
      var claves = {};
      S.registros.forEach(function(r){ claves[r.id] = 1; });
      datos.registros.forEach(function(r){ if (!claves[r.id]) S.registros.push(r); });
    }
    if (typeof datos.umbral === "number") S.umbral = datos.umbral;
    S.registros.sort(function(a,b){ return (b.fecha+b.id).localeCompare(a.fecha+a.id); });
    guardarDatos();
    alert("Copia de respaldo restaurada correctamente.");
    e.target.value = "";
    render();
  };
  lector.readAsText(archivo, "UTF-8");
}

    // el segundo turno arranca peor y va mejorando mas lento que el primero
    TURNOS.forEach(function(turno, ti){

      for (var m = 0; m < 9; m++){

        var tipo = (linea === "E" && Math.random() < 0.5) ? "Semiautomatica" : "Manual";
        var bal = balanzasDe(linea, tipo);
        var total = 20 + Math.floor(Math.random()*16);
        var objetivo = Math.max(0, base + (Math.random()*16 - 7) + (linea === "B" ? 5 : 0));
        var fuera = Math.min(total, Math.round(total * objetivo / 100));
        var critico = Math.round(fuera * (Math.random()*0.15));
        var altas = Math.round((fuera - critico) * (0.45 + Math.random()*0.25));
        var bajas = fuera - altas - critico;
        var horaBase = turno === "Primero" ? 6 : 14;
        var horaAleatoria = new Date(f);
        horaAleatoria.setHours(horaBase + Math.floor(Math.random()*8), Math.floor(Math.random()*60), Math.floor(Math.random()*60));
        r.push({
          id: uid(), fecha: fecha, horaRegistro: horaAleatoria.toISOString(), turno: turno, supervisor: sup[turno], linea: linea, tipo: tipo,

          fuera: fuera, pct: pctDe(fuera, total)
        });
      }
    });
  }
  S.registros = r.reverse();

}

function exportarCSV(){
  var filas = S.registros.map(function(r){
    return [r.fecha, fmtHora(r.horaRegistro), r.turno, r.supervisor, r.linea, r.tipo, r.balanza,
            r.controladora, r.pesador, r.producto,
            r.total, r.altas, r.bajas, (r.critico||0), r.fuera, r.pct.toFixed(2)]
      .map(function(c){ return '"' + String(c==null?"":c).replace(/"/g,'""') + '"'; }).join(";");
  });
  var csv = "\uFEFF" + [CAB.join(";")].concat(filas).join("\r\n");
  var url = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8;" }));
  var a = document.createElement("a");
  a.href = url; a.download = "control-pesos-" + hoyLocal() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function partirCSV(linea){
  var out = [], actual = "", dentro = false, i;
  for (i = 0; i < linea.length; i++){
    var ch = linea[i];
    if (ch === '"'){
      if (dentro && linea[i+1] === '"'){ actual += '"'; i++; }
      else dentro = !dentro;
    } else if (ch === ";" && !dentro){ out.push(actual); actual = ""; }
    else actual += ch;
  }
  out.push(actual);
  return out;
}

function importarCSV(e){
  var archivo = e.target.files[0];
  if (!archivo) return;
  var lector = new FileReader();
  lector.onload = function(ev){
    var texto = String(ev.target.result).replace(/^\uFEFF/, "");
    var lineas = texto.split(/\r?\n/).filter(function(l){ return l.trim(); });
    if (lineas.length < 2){ alert("El archivo no tiene registros."); return; }

    // Mapeo por encabezado: soporta tanto el formato actual como exportaciones anteriores.
    var encabezado = partirCSV(lineas[0]).map(function(h){ return h.trim().toLowerCase(); });
    var idx = function(nombre){ return encabezado.indexOf(nombre.toLowerCase()); };
    var iFecha = idx("Fecha"), iHora = idx("Hora registro"), iTurno = idx("Turno"), iSup = idx("Supervisor"),
        iLinea = idx("Linea"), iTipo = idx("Tipo"), iBalanza = idx("Balanza"), iCtrl = idx("Controladora"),
        iPes = idx("Pesador"), iProd = idx("Producto"), iTotal = idx("Fundas revisadas"),
        iAltas = idx("Peso alto"), iBajas = idx("Peso bajo"), iCritico = idx("Peso critico");

    var claves = {}, nuevos = 0;
    S.registros.forEach(function(r){
      claves[[r.fecha,r.turno,r.linea,r.balanza,r.pesador,r.total,r.altas,r.bajas].join("|")] = 1;
    });
    lineas.slice(1).forEach(function(l){
      var c = partirCSV(l);
      if (c.length < 10) return;
      var total = parseInt(c[iTotal],10);
      var altas = parseInt(c[iAltas],10) || 0;
      var bajas = parseInt(c[iBajas],10) || 0;
      var critico = iCritico > -1 ? (parseInt(c[iCritico],10) || 0) : 0;
      if (isNaN(total) || total <= 0) return;
      var fecha = c[iFecha], linea = c[iLinea], balanza = c[iBalanza], pesador = c[iPes];
      var k = [fecha,c[iTurno],linea,balanza,pesador,total,altas,bajas].join("|");
      if (claves[k]) return;
      claves[k] = 1; nuevos++;
      var fuera = altas + bajas + critico;
      S.registros.push({
        id: uid(), fecha: fecha, horaRegistro: (iHora>-1 ? c[iHora] : "") || "",
        turno: c[iTurno], supervisor: c[iSup], linea: linea, tipo: c[iTipo] || "Manual",
        balanza: balanza, controladora: c[iCtrl], pesador: pesador, producto: c[iProd],
        total: total, altas: altas, bajas: bajas, critico: critico,
        fuera: fuera, pct: pctDe(fuera, total)
      });
    });
    S.registros.sort(function(a,b){ return (b.fecha+b.id).localeCompare(a.fecha+a.id); });
    guardarDatos();
    alert(nuevos + " registros importados. Los repetidos se omitieron.");
    render();
  };
  lector.readAsText(archivo, "UTF-8");
  e.target.value = "";
}


/* ---------------- dinamicas Android ---------------- */
function vibrar(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

// Vibracion al tocar cualquier boton
document.addEventListener("click", function(e){
  if (e.target.closest && e.target.closest("button")) vibrar(12);
}, true);

// Vibracion segun resultado al guardar una muestra
var _guardarMuestra = guardarMuestra;
guardarMuestra = function(){
  var antes = S.registros.length;
  _guardarMuestra();
  if (S.registros.length > antes){
    var u = S.registros[0];
    vibrar(u.pct > S.umbral ? [60,40,60,40,120] : 30);
  } else vibrar([80,50,80]);
};
// Boton "atras" de Android: navega entre pestanas y cierra el modal
history.replaceState({v:"registro"}, "");
(function(){
  var navOrig = pintarNav;
  pintarNav = function(){
    navOrig();
    document.querySelectorAll("#nav button").forEach(function(b){
      b.onclick = function(){
        if (S.vista !== b.dataset.v) history.pushState({v:b.dataset.v}, "");
        S.vista = b.dataset.v; render();
      };
    });
  };
})();
window.addEventListener("popstate", function(e){
  if (document.getElementById("modalEdicion")){ cerrarModalEdicion(); history.pushState({v:S.vista}, ""); return; }
  S.vista = (e.state && e.state.v) || "registro";
  render();
});

// Compartir la copia de respaldo con WhatsApp/Drive/correo (hoja de compartir de Android)
var _descargarRespaldo = descargarRespaldo;
descargarRespaldo = function(){
  try {
    var archivo = new File([JSON.stringify({tipo:"respaldo-control-pesos", version:1, generado:new Date().toISOString(), umbral:S.umbral, registros:S.registros})],

// Mantener la pantalla encendida mientras se registra
var _wl = null;
function pedirPantalla(){
  if (!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").then(function(l){ _wl = l; }).catch(function(){});
}
document.addEventListener("visibilitychange", function(){ if (!document.hidden) pedirPantalla(); });
pedirPantalla();

// Instalable y sin conexion
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

(async function(){
  var datos = await cargar();

    S.registros = datos.registros || [];
    if (typeof datos.umbral === "number") S.umbral = datos.umbral;
  }
  mostrarAviso();
  render();
})();
